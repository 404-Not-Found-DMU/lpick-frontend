name: PR CI - Build and Lint

on:
  pull_request:
    branches:
      - develop
      - feat/**

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Setup Corepack (Yarn)
        run: corepack enable

      - name: Display Yarn/NPM versions
        run: |
          node -v
          corepack yarn -v

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build (includes ESLint)
        run: yarn build

